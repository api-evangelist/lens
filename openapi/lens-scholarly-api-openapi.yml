openapi: 3.2.0
info:
  description: 'This service provides access to the full corpus of Lens scholarly works and Patent documents using the flexibility and convenience of a REST API. The versioned API allows you to combine and perform several search operations to programmatically retrieve results. The API documentation provides guidelines for getting you started with the API and details the request/response schema with examples.


    The Lens uses token-based API authentication. You can request access to the Lens Scholarly API, Lens Patent API or PatSeq Bulk Downloads and manage your access tokens from your Lens user profile.'
  version: ''
  title: Lens Scholarly API
  license:
    name: Terms of Use
    url: https://about.lens.org/lens-api-terms-of-use/
tags:
- name: scholarly
  description: Scholarly Operations
paths:
  /scholarly/search:
    post:
      security:
      - Authorisation: []
      tags:
      - scholarly
      summary: Search scholarly result
      operationId: search
      responses:
        '200':
          description: Valid response from the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScholarApiResponse'
        '204':
          description: No Content
        '400':
          description: Malformed request or incorrect fields/values provided
        '401':
          description: Authentication credentials might be incorrect or missing
        '415':
          description: Request body is not json or Content Type is not application/json
        '404':
          description: Incorrect Resource URL / Empty Result for supplied queries / Expired scroll_id
        '429':
          description: You have exceeded the number of allowed calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScholarlySearchRequest'
        description: Search Request Object
        required: true
    get:
      tags:
      - scholarly
      summary: Get scholarly result
      operationId: search_get
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: query
        in: query
        description: Search Query (e.g. Malaria)
        required: true
        schema:
          type: string
      - name: size
        in: query
        description: Result size
        required: false
        schema:
          type: integer
      - name: from
        in: query
        description: Offset from the first result
        required: false
        schema:
          type: integer
      - name: include
        in: query
        description: Fields to include in response(e.g. title,date_published)
        required: false
        schema:
          type: string
      - name: exclude
        in: query
        description: Fields to exclude in response (e.g. title,date_published)
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: Sort fields (e.g. desc(date_published),asc(created))
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Valid response from the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScholarApiResponse'
        '204':
          description: No Content
        '400':
          description: Malformed request or incorrect fields/values provided
        '401':
          description: Authentication credentials might be incorrect or missing
        '415':
          description: Request body is not json or Content Type is not application/json
        '404':
          description: Incorrect Resource URL / Empty Result for supplied queries / Expired scroll_id
        '429':
          description: You have exceeded the number of allowed calls
  /scholarly/aggregate:
    post:
      security:
      - Authorisation: []
      tags:
      - scholarly
      summary: Scholarly aggregations search
      operationId: aggregate_scholarly
      responses:
        '200':
          description: Valid response from the server
        '400':
          description: Malformed request or incorrect fields/values provided
        '401':
          description: Authentication credentials might be incorrect or missing
        '415':
          description: Request body is not json or Content Type is not application/json
        '404':
          description: Incorrect Resource URL / Empty Result for supplied queries / Expired scroll_id
        '429':
          description: You have exceeded the number of allowed calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AggregationRequestScholarly'
        description: Search and Aggregation Request Object
        required: true
  /schema/scholarly:
    get:
      security:
      - Authorisation: []
      tags:
      - scholarly
      summary: Get scholarly response schema
      operationId: schema_scholarly
      responses:
        '200':
          description: Valid response from the server
        '401':
          description: Authentication credentials might be incorrect or missing
components:
  schemas:
    AggregationRequestScholarly:
      type: object
      properties:
        query:
          type: object
          example:
            match:
              title: Malaria
        aggregations:
          type: object
          example:
            publication_types:
              cardinality:
                field: publication_type
        size:
          type: integer
          example: 0
          description: Number of items per page
    ScholarlySearchRequest:
      type: object
      properties:
        query:
          type: object
          example:
            match:
              title: Malaria
          description: Json query object
        size:
          type: integer
          example: 5
          description: Number of items per page
        from:
          type: integer
          example: 0
          description: Offset from the first result
        include:
          type: array
          example:
          - title
          - lens_id
          - patent_citations_count
          description: Fields to be included in result
          items:
            type: string
        sort:
          type: array
          example:
          - created: desc
          - year_published: asc
          description: Array of object mappings to specify field sorting
          items:
            type: object
        exclude:
          type: array
          example: null
          description: Fields to be excluded from result
          items:
            type: string
        scroll:
          type: string
          example: null
          description: Scroll context time in minute (e.g. 1m)
        scroll_id:
          type: string
          description: For scroll based pagination, provide scroll_id from previous response body.
          example: null
      title: ScholarlySearchRequest
    ScholarApiResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total number of search results exists.
        results:
          type: integer
          description: Number of results in this response.
        data:
          type: array
          description: List of scholarly records
          items:
            type: object
            properties:
              patent_citations:
                type: array
                items:
                  type: object
                  properties:
                    lens_id:
                      type: string
              patent_citations_count:
                type: integer
              lens_id:
                type: string
              alias_lens_ids:
                type: array
                items:
                  type: string
              created:
                type: string
              open_access:
                type: object
                properties:
                  license:
                    type: string
                  colour:
                    type: string
              publication_type:
                type: string
              publication_supplementary_type:
                type: array
                items:
                  type: string
              authors:
                type: array
                items:
                  type: object
                  properties:
                    first_name:
                      type: string
                    last_name:
                      type: string
                    initials:
                      type: string
                    affiliations:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          grid_id:
                            type: string
                          country_code:
                            type: string
                    ids:
                      type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                          value:
                            type: string
              title:
                type: string
              volume:
                type: string
              issue:
                type: string
              languages:
                type: array
                items:
                  type: string
              references:
                type: array
                items:
                  type: object
                  properties:
                    lens_id:
                      type: string
              keywords:
                type: array
                items:
                  type: string
              mesh_terms:
                type: array
                items:
                  type: object
                  properties:
                    mesh_heading:
                      type: string
                    qualifier_name:
                      type: string
                    mesh_id:
                      type: string
                    qualifier_id:
                      type: string
              chemicals:
                type: array
                items:
                  type: object
                  properties:
                    substance_name:
                      type: string
                    registry_number:
                      type: string
                    mesh_id:
                      type: string
              clinical_trials:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    registry:
                      type: string
              fields_of_study:
                type: array
                items:
                  type: string
              funding:
                type: array
                items:
                  type: object
                  properties:
                    org:
                      type: string
                    funding_id:
                      type: string
                    country:
                      type: string
              source_urls:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    url:
                      type: string
              abstract:
                type: string
              year_published:
                type: integer
              references_count:
                type: integer
              scholarly_citations_count:
                type: integer
              external_ids:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    value:
                      type: string
              start_page:
                type: string
              end_page:
                type: string
              source:
                type: object
                properties:
                  title:
                    type: string
                  type:
                    type: string
                  publisher:
                    type: string
                  issn:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        value:
                          type: string
                  country:
                    type: string
                  asjc_codes:
                    type: array
                    items:
                      type: string
                  asjc_subjects:
                    type: array
                    items:
                      type: string
              scholarly_citations:
                type: array
                items:
                  type: string
              author_count:
                type: integer
              date_published:
                type: string
  securitySchemes:
    Authorisation:
      type: apiKey
      name: Authorization
      description: Your access token created from your Lens user profile page
      in: header
externalDocs:
  description: Privacy Policy
  url: https://about.lens.org/policies/#privacypolicy
x-provenance:
  method: harvested
  publisher: Lens
  source: https://api.lens.org/swagger.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
